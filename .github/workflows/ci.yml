name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code matches contract and SQL
        working-directory: backend
        run: go test -count=1 ./internal/api/ && go tool sqlc diff
      - name: Vet
        working-directory: backend
        run: go vet ./... && go vet -tags integration ./...
      - name: Unit tests
        working-directory: backend
        run: go test ./...
      - name: Integration tests (testcontainers PostgreSQL, MinIO, Redis)
        working-directory: backend
        run: go test -tags integration -count=1 ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build (fails if client types are stale against the contract)
        working-directory: web
        run: pnpm build
      - name: Unit tests
        working-directory: web
        run: pnpm test:unit

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Start local stack
        run: make up
      - working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        run: pnpm test:e2e
        env:
          CI: "true"
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
