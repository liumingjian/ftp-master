services:
  web:
    build: !reset null
    image: nginx:1.29-alpine
    ports: !override ["127.0.0.1:${FTP_MASTER_WEB_PORT:-8088}:80"]
    volumes:
      - ./nginx.qa.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
        restart: true

  frontend:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      target: development
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    volumes:
      - ../../web/src:/src/web/src:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173/')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30
