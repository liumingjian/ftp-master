          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ftp_master_session
      description: >-
        HttpOnly cookie set by signIn. A session ends after 2 hours without
        activity; every authenticated request extends it.
  responses:
    Unauthorized:
      description: There is no valid session for an active User.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    OfficeEdit:
      type: object
      required: [permitId, documentUrl, saveUrl, deliveryCheckUrl, title, format, expiresAt, versionId]
      properties:
        permitId: {type: string}
        documentUrl: {type: string}
        saveUrl: {type: string}
        deliveryCheckUrl: {type: string}
        title: {type: string}
        format: {type: string, enum: [doc, docx, wps, xls, xlsx]}
        expiresAt: {type: string, format: date-time}
        versionId: {type: integer, format: int64}
    TreeNode:
      type: object
      required: [id, name, isFile, rights, traversable]
      properties:
        id: {type: integer, format: int64}
        parentId: {type: integer, format: int64}
        name: {type: string}
        isFile: {type: boolean}
        rights: {type: integer}
        traversable: {type: boolean}
    GrantImpact:
      type: object
      required: [changedUsers, coveredItems, warnings]
      properties:
        changedUsers: {type: integer}
        coveredItems: {type: integer}
        warnings: {type: array, items: {type: string}}
    PermissionInspection:
      type: object
      required: [userId, rights, traversable, administrator, sources]
      properties:
        userId: {type: integer, format: int64}
        rights: {type: integer}
        traversable: {type: boolean}
        administrator: {type: boolean}
        sources: {type: array, items: {$ref: '#/components/schemas/SourcedGrant'}}
    SourcedGrant:
      type: object
      required: [grant, sourceId, sourcePath, inherited]
      properties:
        grant: {$ref: '#/components/schemas/TreeGrant'}
        sourceId: {type: integer, format: int64}
        sourcePath: {type: string}
        inherited: {type: boolean}
    TreeGrantInput:
      type: object
      required: [principalKind, principalId, rights, scope]
      properties:
        creator: {type: boolean, description: 'Create a Creator Grant; requires Grant on the parent directory and a User principal with all Rights.'}
        principalKind: {type: string, enum: [user, organization, user_group]}
        principalId: {type: integer, format: int64}
        rights: {type: integer, minimum: 1, maximum: 63}
        scope: {type: string, enum: [subtree, this_level_only]}
    TreeGrant:
      allOf:
        - {$ref: '#/components/schemas/TreeGrantInput'}
        - type: object
          required: [id, creator]
          properties:
            id: {type: integer, format: int64}
            creator: {type: boolean}
    ManagedUser:
      type: object
      required: [id, username, displayName, status, organizationId]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        displayName: {type: string}
        status: {type: string}
        organizationId: {type: integer, format: int64}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable reason, e.g. unauthenticated, invalid_credentials.
        message:
          type: string
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      required: [id, username, displayName, isAdministrator, organizationId]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        organizationId: {type: integer, format: int64}
        isAdministrator:
          type: boolean
    Health:
      type: object
      required: [status, database, objectStorage, cache, checkedAt, uptimeSeconds]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        objectStorage:
          $ref: "#/components/schemas/DependencyHealth"
        cache:
          $ref: "#/components/schemas/DependencyHealth"
        checkedAt:
          type: string
          format: date-time
          description: When the service performed this check, by its Clock.
        uptimeSeconds:
          type: integer
          format: int64
          description: Whole seconds since the service instance started, by its Clock.
    HealthStatus:
      type: string
      enum: [ok, degraded]
    DependencyHealth:
      type: object
      description: >-
        Whether a backing store answered. Failure details are logged by the
        service, never returned, since this endpoint needs no sign-in.
      required: [up]
      properties:
        up:
          type: boolean
    DatabaseHealth:
      type: object
      required: [up, schemaVersion]
      properties:
        up:
          type: boolean
        schemaVersion:
          type: integer
          format: int64
          description: Latest migration version applied, as read from PostgreSQL; 0 when down.
    OrganizationInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        parentId:
          type: integer
          format: int64
          nullable: true
    Organization:
      type: object
      required:
      - id
      - name
      - parentId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 150
        parentId:
          type: integer
          format: int64
          nullable: true
    UserGroupInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
    UserGroup:
      type: object
      required:
      - id
      - name
      - userIds
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 150
        userIds:
          type: array
          items:
            type: integer
            format: int64
    GroupMembers:
      type: object
      required:
      - userIds
      properties:
        userIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
    Organizations:
      type: array
      items:
        "$ref": "#/components/schemas/Organization"
    UserGroups:
      type: array
      items:
        "$ref": "#/components/schemas/UserGroup"
    RegistrationInput:
      type: object
      required: [username, displayName, organizationHint, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 150}
        displayName: {type: string, minLength: 1, maxLength: 150}
        organizationHint: {type: string, minLength: 1, maxLength: 150}
        password: {type: string, minLength: 1, maxLength: 1024}
    Registration:
      type: object
      required: [id, username, displayName, organizationHint]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        displayName: {type: string}
        organizationHint: {type: string}
    UploadInput:
      type: object
      required: [parentId, name, size]
      properties:
        parentId: {type: integer, format: int64}
        name: {type: string}
        size: {type: integer, format: int64}
    UploadSession:
      type: object
      required: [id, partSize, partCount]
      properties:
        id: {type: string}
        partSize: {type: integer, format: int64}
        partCount: {type: integer}
    PartInput:
      type: object
      required: [numbers]
      properties:
        numbers: {type: array, items: {type: integer}, maxItems: 100}
    PartURLs:
      type: array
      items:
        type: object
        required: [number, url]
        properties:
          number: {type: integer}
          url: {type: string}
    FileVersion:
      type: object
      required: [id, size, format, createdBy, username, createdAt]
      properties:
        id: {type: integer, format: int64}
        size: {type: integer, format: int64}
        format: {type: string}
        createdBy: {type: integer, format: int64}
        username: {type: string}
        createdAt: {type: string, format: date-time}
    UploadReceipt:
      type: object
      required: [fileId, versionId]
      properties:
        fileId: {type: integer, format: int64}
        versionId: {type: integer, format: int64}
    UploadPolicy:
      type: object
      required: [blockedExtensions]
      properties:
        blockedExtensions: {type: array, items: {type: string}}
