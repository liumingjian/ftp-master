openapi: 3.0.3
info:
  title: ftp-master API
  version: 0.1.0
  description: >-
    The single source of truth for the ftp-master HTTP API. Backend handlers
    and frontend client types are generated from this file (ADR 0004).
servers:
  - url: /api
# Every operation requires a signed-in, active User unless it opts out with
# `security: []`. Only sign-in, Registration and health checks may opt out.
security:
  - session: []
paths:
  /registrations:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Registration pending approval.
        '400':
          description: Invalid request.
        '409':
          description: Conflict.
    get:
      operationId: listRegistrations
      responses:
        '200':
          description: Pending Registrations, Administrator only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registration'
        '403':
          description: Administrator required.
  /registrations/{id}/activate:
    post:
      operationId: activateRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId: {type: integer, format: int64}
      responses:
        '204':
          description: Registration processed with an Audit Event.
        '400':
          description: Invalid request.
        '403':
          description: Administrator required.
        '404':
          description: Not found.
        '409':
          description: Conflict.
  /registrations/{id}/reject:
    post:
      operationId: rejectRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      responses:
        '204':
          description: Registration processed with an Audit Event.
        '400':
          description: Invalid request.
        '403':
          description: Administrator required.
        '404':
          description: Not found.
        '409':
          description: Conflict.
  /health:
    get:
      operationId: getHealth
      summary: Report whether the service and its backing stores are reachable.
      security: []
      responses:
        "200":
          description: Every backing store is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one backing store is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /session:
    get:
      operationId: getSession
      summary: Return the signed-in User of the current session.
      responses:
        "200":
          description: The session is valid; its idle expiry is extended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: signIn
      summary: Sign in with username and password, starting a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "403":
          description: Verified credentials belong to a pending Registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: The username and password do not identify an active User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: signOut
      summary: Sign out, ending the current session immediately.
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /password:
    put:
      operationId: changePassword
      summary: Change the signed-in User's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        "204":
          description: Password changed.
        default:
          $ref: "#/components/responses/Unauthorized"
  /users/{userId}/password:
    put:
      operationId: resetPassword
      summary: Reset a User's password as an Administrator.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        "204":
          description: Password reset.
        default:
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    get:
      operationId: listOrganizations
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organizations"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: createOrganization
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organization"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrganizationInput"
  /organizations/{id}:
    patch:
      operationId: updateOrganization
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organization"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrganizationInput"
    delete:
      operationId: deleteOrganization
      responses:
        '204':
          description: Success.
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
  /user-groups:
    get:
      operationId: listUserGroups
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserGroups"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: createUserGroup
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserGroup"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserGroupInput"
  /user-groups/{id}/members:
    put:
      operationId: setUserGroupMembers
      responses:
        '204':
          description: Success.
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GroupMembers"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ftp_master_session
      description: >-
        HttpOnly cookie set by signIn. A session ends after 2 hours without
        activity; every authenticated request extends it.
  responses:
    Unauthorized:
      description: There is no valid session for an active User.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable reason, e.g. unauthenticated, invalid_credentials.
        message:
          type: string
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      required: [id, username, displayName, isAdministrator]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        isAdministrator:
          type: boolean
    Health:
      type: object
      required: [status, database, objectStorage, cache, checkedAt, uptimeSeconds]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        objectStorage:
          $ref: "#/components/schemas/DependencyHealth"
        cache:
          $ref: "#/components/schemas/DependencyHealth"
        checkedAt:
          type: string
          format: date-time
          description: When the service performed this check, by its Clock.
        uptimeSeconds:
          type: integer
          format: int64
          description: Whole seconds since the service instance started, by its Clock.
    HealthStatus:
      type: string
      enum: [ok, degraded]
    DependencyHealth:
      type: object
      description: >-
        Whether a backing store answered. Failure details are logged by the
        service, never returned, since this endpoint needs no sign-in.
      required: [up]
      properties:
        up:
          type: boolean
    DatabaseHealth:
      type: object
      required: [up, schemaVersion]
      properties:
        up:
          type: boolean
        schemaVersion:
          type: integer
          format: int64
          description: Latest migration version applied, as read from PostgreSQL; 0 when down.
    OrganizationInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        parentId:
          type: integer
          format: int64
          nullable: true
    Organization:
      type: object
      required:
      - id
      - name
      - parentId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 150
        parentId:
          type: integer
          format: int64
          nullable: true
    UserGroupInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
    UserGroup:
      type: object
      required:
      - id
      - name
      - userIds
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 150
        userIds:
          type: array
          items:
            type: integer
            format: int64
    GroupMembers:
      type: object
      required:
      - userIds
      properties:
        userIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
    Organizations:
      type: array
      items:
        "$ref": "#/components/schemas/Organization"
    UserGroups:
      type: array
      items:
        "$ref": "#/components/schemas/UserGroup"
    RegistrationInput:
      type: object
      required: [username, displayName, organizationHint, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 150}
        displayName: {type: string, minLength: 1, maxLength: 150}
        organizationHint: {type: string, minLength: 1, maxLength: 150}
        password: {type: string, minLength: 1, maxLength: 1024}
    Registration:
      type: object
      required: [id, username, displayName, organizationHint]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        displayName: {type: string}
        organizationHint: {type: string}
