openapi: 3.0.3
info:
  title: ftp-master API
  version: 0.1.0
  description: >-
    The single source of truth for the ftp-master HTTP API. Backend handlers
    and frontend client types are generated from this file (ADR 0004).
servers:
  - url: /api
# Every operation requires a signed-in, active User unless it opts out with
# `security: []`. Only sign-in, Registration and health checks may opt out.
security:
  - session: []
paths:
  /recycle-bin:
    get:
      operationId: listRecycleBin
      responses:
        '200':
          description: Entries restorable by the signed-in User.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, originalPath, deletedAt]
                  properties:
                    id: {type: integer, format: int64}
                    originalPath: {type: string}
                    deletedAt: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/restore:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    post:
      operationId: restoreTreeNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId: {type: integer, format: int64, nullable: true}
      responses:
        '204': {description: Completed}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/purge:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    delete:
      operationId: purgeTreeNode
      responses:
        '204': {description: Completed}
        default: {$ref: '#/components/responses/Unauthorized'}
  /office/permits/{permitId}/document/{filename}:
    parameters:
      - {name: permitId, in: path, required: true, schema: {type: string}}
      - {name: filename, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOfficeDocument
      security: []
      responses:
        "200":
          description: Exact immutable document bytes; delivery is recorded only after the full response.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Unauthorized"}
  /office/permits/{permitId}/save:
    parameters:
      - {name: permitId, in: path, required: true, schema: {type: string}}
    post:
      operationId: saveOffice
      description: Writer multipart filedata, md5sum and filename; ET multipart single file (empty filename or form value).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filedata: {type: string, format: binary}
                md5sum: {type: string}
                filename: {type: string}
                file: {type: string, format: binary}
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: &officeReceipt
                type: object
                required: [Success, Message, Data]
                properties:
                  Success: {type: boolean}
                  Message: {type: string}
                  Data: {type: object, nullable: true, additionalProperties: true}
        default:
          description: Failed; file unchanged.
          content:
            application/json:
              schema: *officeReceipt
  /office/permits/{permitId}/delivery:
    parameters:
      - {name: permitId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOfficeDelivery
      responses:
        "200":
          description: Delivery state for the issuing User.
          content:
            application/json:
              schema:
                type: object
                required: [delivered]
                properties:
                  delivered: {type: boolean}
        default: {$ref: "#/components/responses/Unauthorized"}
  /files/{id}/office-edits:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    post:
      operationId: startOfficeEdit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId: {type: integer, format: int64, minimum: 1}
      responses:
        '201':
          description: Edit Permit issued; gateway read expires after five minutes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficeEdit'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/versions:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    get:
      operationId: listFileVersions
      responses:
        '200':
          description: All retained File Versions, newest first. Requires Browse.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FileVersion'}}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/versions/{versionId}/restore:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
      - {in: path, name: versionId, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      operationId: restoreFileVersion
      responses:
        '201':
          description: Appended a new File Version sharing the immutable content. Requires Modify.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadReceipt'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/search:
    get:
      operationId: searchTree
      parameters:
        - {in: query, name: q, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
      responses:
        "200":
          description: Files matching the literal case-insensitive name query with current Browse.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/TreeNode"}}
        default: {$ref: "#/components/responses/Unauthorized"}
  /tree/{id}/preview:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    get:
      operationId: previewFile
      parameters:
        - {in: header, name: Range, schema: {type: string}}
      responses:
        "200":
          description: Safe inline immutable content, requires Browse and produces no Audit Event.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: Partial media content.
        default: {$ref: "#/components/responses/Unauthorized"}
  /tree/{id}/download:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    get:
      operationId: downloadFile
      parameters:
        - {in: query, name: versionId, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "302":
          description: Authorized short-lived capability for immutable file bytes. Audit records issuance.
          headers:
            Location: {required: true, schema: {type: string}}
            Cache-Control: {required: true, schema: {type: string}}
        default: {$ref: "#/components/responses/Unauthorized"}
  /audit/query:
    post:
      operationId: queryAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: string, format: date-time}
                to: {type: string, format: date-time}
                userIds: {type: array, items: {type: integer, format: int64}}
                organizationId: {type: integer, format: int64}
                directory: {type: string}
                includeSubdirectories: {type: boolean, default: true}
                action: {type: string}
                category: {type: string, enum: [session, read, write, delete, grant, account]}
                failuresOnly: {type: boolean}
                itemId: {type: integer, format: int64}
                page: {type: integer, minimum: 1, default: 1}
                export: {type: boolean}
      responses:
        '200':
          description: Paged events and historical directory suggestions, or all filtered events as CSV. No Audit Event is recorded.
          content:
            application/json:
              schema:
                type: object
                required: [events, total, page, directories]
                properties:
                  total: {type: integer}
                  page: {type: integer}
                  directories:
                    type: array
                    items:
                      type: object
                      required: [path, exists]
                      properties:
                        path: {type: string}
                        exists: {type: boolean}
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, time, userId, username, sourceIp, action, outcome, itemId, path, detail]
                      properties:
                        id: {type: integer, format: int64}
                        time: {type: string, format: date-time}
                        userId: {type: integer, format: int64, nullable: true}
                        username: {type: string}
                        sourceIp: {type: string}
                        action: {type: string}
                        outcome: {type: string, enum: [success, failure]}
                        itemId: {type: integer, format: int64, nullable: true}
                        path: {type: string}
                        detail: {type: object, additionalProperties: true}
            text/csv:
              schema: {type: string}
        default: {$ref: '#/components/responses/Unauthorized'}
  /upload-batches:
    post:
      operationId: initiateUploadBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentId, name, files]
              properties:
                parentId: {type: integer, format: int64}
                name: {type: string}
                files:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    required: [path, size]
                    properties:
                      path: {type: string}
                      size: {type: integer, format: int64}
      responses:
        '201':
          description: Sessions in the same order as the input manifest. Publication is atomic.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UploadSession'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /uploads:
    post:
      operationId: initiateUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadInput'}
      responses:
        '201':
          description: Successful transfer operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /uploads/{id}/parts:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      operationId: listUploadParts
      responses:
        '200':
          description: Authoritative stored multipart part numbers, read from object storage.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [number]
                  properties:
                    number: {type: integer}
        default: {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: issueUploadParts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartInput'}
      responses:
        '200':
          description: Successful transfer operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartURLs'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /uploads/{id}/complete:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      operationId: completeUpload
      parameters:
        - in: query
          name: collision
          description: Resolve a visible name clash; hidden clashes always keep both silently.
          schema: {type: string, enum: [new_version, keep_both]}
      responses:
        '200':
          description: Successful transfer operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadReceipt'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /upload-policy:
    get:
      operationId: getUploadPolicy
      responses:
        '200':
          description: Successful transfer operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPolicy'}
        default: {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: setUploadPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadPolicy'}
      responses:
        '200':
          description: Successful transfer operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPolicy'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree:
    get:
      operationId: listTree
      parameters:
        - in: query
          name: parentId
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Visible children; traversable paths never reveal siblings.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TreeNode'}}
        default: {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                parentId: {type: integer, format: int64}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}:
    delete:
      operationId: deleteTreeNode
      responses:
        '204': {description: Completed}
        default: {$ref: '#/components/responses/Unauthorized'}
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, format: int64}
    get:
      operationId: getTreeNode
      responses:
        '200':
          description: Visible item, including its effective Rights.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/rename:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, format: int64}
    post:
      operationId: renameTreeNode
      description: Requires Modify on the item. Returns 409 for name conflicts or cycles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '200':
          description: Updated stable item; metadata and Audit Event committed together.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/move:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, format: int64}
    post:
      operationId: moveTreeNode
      description: Requires Delete on the source parent and Upload on the destination. Null destination means root and requires Administrator. Returns 409 for name conflicts or cycles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentId]
              properties:
                parentId: {type: integer, format: int64, nullable: true}
      responses:
        '200':
          description: Updated stable item; metadata and Audit Event committed together.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/grant-draft:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      operationId: getGrantDraft
      responses:
        '200':
          description: Direct and inherited Grants with their sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SourcedGrant'}
        default: {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: saveGrantDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [add, remove]
              properties:
                add: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TreeGrantInput'}}
                remove: {type: array, maxItems: 100, items: {type: integer, format: int64}}
      responses:
        '204': {description: Draft committed atomically}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/grant-draft/preview:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      operationId: previewGrantDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [add, remove]
              properties:
                add: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TreeGrantInput'}}
                remove: {type: array, maxItems: 100, items: {type: integer, format: int64}}
      responses:
        '200':
          description: Exact effective Rights changes; validation runs in a rolled-back transaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantImpact'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/permission:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      operationId: inspectPermission
      parameters:
        - {name: userId, in: query, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Own Effective Permission or Administrator inspection of another User
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionInspection'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/grants:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, format: int64}
    get:
      operationId: listTreeGrants
      responses:
        '200':
          description: Direct Grants.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TreeGrant'}}
        default: {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createTreeGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TreeGrantInput'}
      responses:
        '201':
          description: Grant created and audited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeGrant'}
        default: {$ref: '#/components/responses/Unauthorized'}
  /tree/{id}/grants/{grantId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, format: int64}
      - in: path
        name: grantId
        required: true
        schema: {type: integer, format: int64}
    delete:
      operationId: deleteTreeGrant
      responses:
        '204': {description: Grant revoked and audited.}
        default: {$ref: '#/components/responses/Unauthorized'}
  /registrations:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Registration pending approval.
        '400':
          description: Invalid request.
        '409':
          description: Conflict.
    get:
      operationId: listRegistrations
      responses:
        '200':
          description: Pending Registrations, Administrator only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registration'
        '403':
          description: Administrator required.
  /registrations/{id}/activate:
    post:
      operationId: activateRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId: {type: integer, format: int64}
      responses:
        '204':
          description: Registration processed with an Audit Event.
        '400':
          description: Invalid request.
        '403':
          description: Administrator required.
        '404':
          description: Not found.
        '409':
          description: Conflict.
  /registrations/{id}/reject:
    post:
      operationId: rejectRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      responses:
        '204':
          description: Registration processed with an Audit Event.
        '400':
          description: Invalid request.
        '403':
          description: Administrator required.
        '404':
          description: Not found.
        '409':
          description: Conflict.
  /health:
    get:
      operationId: getHealth
      summary: Report whether the service and its backing stores are reachable.
      security: []
      responses:
        "200":
          description: Every backing store is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one backing store is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /session:
    get:
      operationId: getSession
      summary: Return the signed-in User of the current session.
      responses:
        "200":
          description: The session is valid; its idle expiry is extended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: signIn
      summary: Sign in with username and password, starting a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "403":
          description: Verified credentials belong to a pending Registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: The username and password do not identify an active User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: signOut
      summary: Sign out, ending the current session immediately.
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /password:
    put:
      operationId: changePassword
      summary: Change the signed-in User's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        "204":
          description: Password changed.
        default:
          $ref: "#/components/responses/Unauthorized"
  /users/{userId}/password:
    put:
      operationId: resetPassword
      summary: Reset a User's password as an Administrator.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        "204":
          description: Password reset.
        default:
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    get:
      operationId: listOrganizations
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organizations"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: createOrganization
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organization"
        '400':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Request refused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
